# Server Configuration
server:
  port: 8082 # Port for the Project Service

# Spring Application Configuration
spring:
  application:
    name: fm-project-service

  # Database (PostgreSQL) Configuration
  datasource:
    # Note the different port and database name
    url: jdbc:postgresql://localhost:5433/fm_project_service_db
    username: fm_user
    password: password
    driver-class-name: org.postgresql.Driver

  # JPA and Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis Cache Configuration
  data:
    redis:
      host: localhost
      port: 6379

  cache:
    type: redis

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672

# OpenAPI (Swagger UI) Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
